;monitor_port = COM6
monitor_speed = 74800


lib_deps = 
;  lvgl/lvgl @ ^9.2.2
;  bodmer/TFT_eSPI @ ^2.5.43
;  bodmer/TFT_Touch @ ^0.3
  lovyan03/LovyanGFX @ ^1.2.0